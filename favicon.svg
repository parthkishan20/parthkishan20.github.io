<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #1D1D1F; }
    .fg { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #F5F5F7; }
      .fg { fill: #1D1D1F; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="32" height="32" rx="9"/>
  <text class="fg" x="16" y="17" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="600" letter-spacing="-0.5">P</text>
</svg>
